<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CDN Font Awesome  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <title th:text="${title}">Bootstrap demo</title>
</head>

<body>
    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col-12 d-flex align-items-center justify-content-between">
                <h1 class="m-0" th:text="${title}">Tutti gli autori</h1>
                <div>
                    <!-- Pulsante per Post -->
                    <a th:href="@{/posts}" class="btn btn-outline-secondary me-2">Gestisci Post</a>
                    <a th:href="@{/authors/create}" class="btn btn-primary">
                        <i class="fa-solid fa-plus"></i> Inserisci Autore
                    </a>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <table class="table table-striped table-responsive-lg align-middle">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Name</th>
                            <th>Surname</th>
                            <th>Email</th>
                            <th>Azioni</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="author : ${authors}">
                            <td th:text="${author.id}"></td>
                            <td th:text="${author.name}"></td>
                            <td th:text="${author.surname}"></td>
                            <td th:text="${author.email}"></td>
                            <td>
                                <a th:href="@{/authors/edit/{id}(id=${author.id})}" class="btn btn-sm btn-warning me-2">
                                    <i class="fa-solid fa-pen"></i> Modifica
                                </a>
                                <a th:href="@{/authors/delete/{id}(id=${author.id})}" class="btn btn-sm btn-danger"
                                    onclick="return confirm('Sei sicuro di voler eliminare questo autore?');">
                                    <i class="fa-solid fa-trash"></i> Elimina
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>


    <!-- Bootstrap JS  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
