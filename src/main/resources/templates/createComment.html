<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Create comment</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-12 my-5 d-flex justify-content-center align-items-center">
                <span class="h1">Create comment</span>
            </div>
            <div class="col-12 my-5">
                <form th:action="@{/comments}" method="POST" th:object="${comment}">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-3">
                        <label for="email" class="form-label">User email</label>
                        <input id="email" type="email" class="form-control" th:field="*{email}" placeholder="Email..."
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="body" class="form-label">Comment body</label>
                        <textarea id="body" class="form-control" th:field="*{body}" rows="4" placeholder="Body..."
                            required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input id="date" type="date" class="form-control" th:field="*{date}" required>
                    </div>
                    <div class="mb-3">
                        <label for="postId" class="form-label">Post</label>
                        <select id="postId" class="form-select" th:field="*{postId}" required>
                            <option value="">Seleziona un post</option>
                            <option th:each="post : ${posts}" th:value="${post.id}" th:text="${post.title}"></option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success">Save</button>
                    <button type="reset" class="btn btn-danger">Reset</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
