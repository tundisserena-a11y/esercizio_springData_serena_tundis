<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Create post</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-12 my-5 d-flex justify-content-center align-items-center">
                <span class="h1">Create post</span>
            </div>
            <div class="col-12 my-5">
                <form th:action="@{/posts}" method="POST" th:object="${post}">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="title" class="form-label">Post title</label>
                        <input id="title" type="text" class="form-control" th:field="*{title}" placeholder="Title..."
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="body" class="form-label">Post body</label>
                        <textarea id="body" class="form-control" th:field="*{body}" rows="4" placeholder="Body..."
                            required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input id="date" type="text" class="form-control" th:field="*{date}" placeholder="YYYY-MM-DD"
                            required>
                    </div>

                    <button type="submit" class="btn btn-success">Save</button>
                    <button type="reset" class="btn btn-danger">Reset</button>
                </form>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
