<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap css-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <title th:text="${title}">Title</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-12 my-4">
                <h1 class="text-center">Accedi!</h1>
                <h2 class="text-center">inserisci username e password</h2>
            </div>
        </div>
    </div>

    <div th:if="${param.logout}">
        You have been logged out.
    </div>

    <!-- FORM -->
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-9 col-lg-6 mx-auto">
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="usernameLogin" class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" id="usernameLogin">
                    </div>
                    <div class="mb-3">
                        <label for="passwordLogin" class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" id="passwordLogin">
                    </div>
                    <div class="d-flex justify-content-evenly">
                        <button type="submit" value="log in" class="btn btn-primary">Log In</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS originale semplificato -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
